name: ComuniDados Eleicoes 2026
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/comunidados-eleicoes-2026.yml"
permissions:
  contents: write
concurrency:
  group: comunidados-eleicoes-2026
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: 01-projects/01-incubating/comunidados-eleicoes-2026
        run: pip install -r requirements.txt
      - name: Test
        working-directory: 01-projects/01-incubating/comunidados-eleicoes-2026
        run: pytest -q
      - name: Collect once
        working-directory: 01-projects/01-incubating/comunidados-eleicoes-2026
        run: python src/collector.py --once
      - name: Commit new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-projects/01-incubating/comunidados-eleicoes-2026/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add TSE election snapshot [skip ci]"
          git push
